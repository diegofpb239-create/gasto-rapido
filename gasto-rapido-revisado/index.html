<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gasto Rápido</title>
  <meta name="description" content="Registra tus gastos en 3 toques y detecta fugas de dinero.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1113" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>

  <nav id="nav" aria-label="Secciones">
    <button data-view="capture" aria-label="Captura">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Captura</span>
    </button>
    <button data-view="movements" aria-label="Movimientos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>Movimientos</span>
    </button>
    <button data-view="summary" aria-label="Resumen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Resumen</span>
    </button>
    <button data-view="settings" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg><span>Ajustes</span>
    </button>
  </nav>

  <div id="sheet-root" aria-live="off"></div>
  <div id="dialog-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript>Gasto Rápido necesita JavaScript activado.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
